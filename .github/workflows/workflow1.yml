name: CMake on multiple platforms

on:
  push:
    branches: [ "master", "development" ]
  pull_request:
    branches: [ "master", "development" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GCC
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            fortran_compiler: gcc
            build_type: Release
          
          # Linux Clang
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            fortran_compiler: gcc
            build_type: Release
          
          # macOS GCC
          - os: macos-latest
            c_compiler: gcc-13
            cpp_compiler: g++-13
            fortran_compiler: gcc
            fortran_version: 13
            build_type: Release
          
          # Windows GCC (MinGW)
          - os: windows-latest
            c_compiler: gcc
            cpp_compiler: g++
            fortran_compiler: gcc
            build_type: Release

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Fortran
      uses: fortran-lang/setup-fortran@v1
      id: setup-fortran
      with:
        compiler: ${{ matrix.fortran_compiler }}
        version: ${{ matrix.fortran_version || '' }}
    
    - name: Setup CMake policy for dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        echo "CMAKE_POLICY_DEFAULT_CMP0000=NEW" >> $GITHUB_ENV
    
    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
    
    - name: Configure CMake
      shell: bash
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_Fortran_COMPILER=${{ steps.setup-fortran.outputs.fc }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_POLICY_DEFAULT_CMP0000=NEW
        -S ${{ github.workspace }}
    
    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}
    
    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure
