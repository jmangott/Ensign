name: Build and Test Ensign

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} | ${{ matrix.build_type }} | CC=${{ matrix.cc }} | FC=${{ matrix.fc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Release]
        include:
          # Linux: GCC
          - os: ubuntu-latest
            cc: gcc
            fc: gfortran
          # Linux: Clang + gfortran
          - os: ubuntu-latest
            cc: clang
            fc: gfortran
          # macOS: GCC + gfortran
          - os: macos-latest
            cc: gcc
            fc: gfortran
          # macOS: Clang + gfortran
          - os: macos-latest
            cc: clang
            fc: gfortran
          # Windows: GCC + gfortran via MSYS2/MinGW
          - os: windows-latest
            cc: gcc
            fc: gfortran

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      #####################################################################
      # 🧩 macOS setup — reinstall CMake to avoid stale compatibility files
      #####################################################################
      - name: Update and reinstall CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew reinstall cmake
          cmake --version

      ##########################################################
      # 🧩 Install dependencies per OS
      ##########################################################
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake make git
          if [ "${{ matrix.cc }}" = "clang" ]; then
            sudo apt-get install -y clang
          else
            sudo apt-get install -y gcc g++
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc gfortran fftw
          brew info fftw
          cmake --version

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install -y msys2
          export PATH=/c/tools/msys64/usr/bin:$PATH
          pacman -Syu --noconfirm
          pacman -S --noconfirm mingw-w64-x86_64-gcc mingw-w64-x86_64-gcc-fortran mingw-w64-x86_64-cmake make
          cmake --version
          gfortran --version

      ##########################################################
      # 🧩 Configure, build, and test
      ##########################################################
      - name: Configure with CMake
        shell: bash
        run: |
          export CC=${{ matrix.cc }}
          export FC=${{ matrix.fc }}
          cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DENABLE_TESTS=ON

      - name: Build Ensign
        shell: bash
        run: |
          cmake --build build --parallel 2

      - name: Run tests
        shell: bash
        working-directory: build
        run: ctest --output-on-failure
